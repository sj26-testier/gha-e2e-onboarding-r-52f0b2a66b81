{"name": "compare-both", "on": {"push": {"branches": ["case-*"], "paths": ["old/**", "new/**"]}, "pull_request": {"paths": ["old/**", "new/**"]}}, "permissions": {}, "jobs": {"observe": {"runs-on": "ubuntu-latest", "timeout-minutes": 2, "steps": [{"run": "printf \"EVENT=%s SHA=%s REF=%s\\n\" \"$GITHUB_EVENT_NAME\" \"$GITHUB_SHA\" \"$GITHUB_REF\""}]}}}